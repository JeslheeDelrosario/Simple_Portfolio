<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeslhee Portfolio</title>
    <!-- Favicons -->
    <link rel="icon" href="./Images/favi/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="./Images/favi/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="./Images/favi/favicon-96x96.png">
    <link rel="apple-touch-icon" href="./Images/favi/apple-touch-icon.png">
    <link rel="manifest" href="./Images/favi/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Main.css">
</head>
<body>

<main id="page-shell" class="page-shell">
    <div class="page-loader">
        <p>Loading page sections…</p>
    </div>
</main>

<script>
    const sectionFiles = [
        'navbar',
        'hero',
        'about',
        'skills',
        'projects',
        'footer',
        'modals'
    ];

    async function fetchSection(name) {
        const response = await fetch(`sections/${name}.html`);
        if (!response.ok) {
            throw new Error(`Failed to load section: ${name}`);
        }
        return response.text();
    }

    async function loadSections() {
        const shell = document.getElementById('page-shell');

        for (const section of sectionFiles) {
            const html = await fetchSection(section);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            shell.appendChild(wrapper);
        }

        const loader = document.querySelector('.page-loader');
        if (loader) loader.remove();

        const script = document.createElement('script');
        script.src = 'function.js';
        document.body.appendChild(script);
    }

    loadSections().catch(error => {
        console.error(error);
        const shell = document.getElementById('page-shell');
        if (shell) shell.innerHTML = '<div class="page-error"><p>Unable to load page sections. Please refresh the page.</p></div>';
    });
</script>

</body>
</html>
